services:
  # ============================================
  # PostgreSQL 16
  # ============================================
  postgres:
    image: postgres:16-alpine
    container_name: famfit-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: famfit
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================
  # Backend (.NET 9)
  # ============================================
  backend:
    build:
      context: .
      dockerfile: src/FamFit.WebApi/Dockerfile
    container_name: famfit-backend
    restart: unless-stopped
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__FamFit=Host=postgres;Port=5432;Database=famfit;Username=postgres;Password=postgres
      - Jwt__Secret=FamFitSuperSecretKeyForJwtTokenGeneration2026ChangeInProd!
      - Jwt__Issuer=FamFit.WebApi
      - Jwt__Audience=FamFitClient
      - WebPush__PublicKey=
      - WebPush__PrivateKey=
      - WebPush__ContactEmail=admin@famfit.local
      - FrontendUrl=http://localhost:5173
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ============================================
  # Frontend (Nginx + React)
  # ============================================
  frontend:
    build:
      context: src/FamFit.Frontend
      dockerfile: Dockerfile
    container_name: famfit-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
